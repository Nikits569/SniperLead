{% load static %}
{% load i18n %}

<!DOCTYPE html>
<html lang="sk" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% trans "Registrácia — SniperLead" %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="h-full flex items-center justify-center antialiased py-12">

  <div class="max-w-md w-full mx-4">
    <!-- Логотип -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-black text-white text-lg shadow-md shadow-indigo-600/20">🎯</div>
        <span class="font-extrabold text-2xl tracking-tight text-slate-900">{% trans "SniperLead" %}</span>
      </a>
      <h2 class="text-xl font-extrabold text-slate-900 mt-4">{% trans "Vytvorte si účet" %}</h2>
      <p class="text-xs text-slate-500 mt-1">{% trans "Získajte 3 dni plného prístupu k radarom zadarmo" %}</p>
    </div>

    <!-- Форма -->
    <div class="bg-white border border-slate-200/80 rounded-3xl p-8 shadow-xl shadow-slate-200/50">
      <form method="POST" action="" class="space-y-4">
        {% csrf_token %}

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">{% trans "Vaše meno / Firma" %}</label>
          <input type="text" name="name" required placeholder="Ján Novák"
                 class="w-full px-4 py-3 rounded-xl border border-slate-200 text-xs font-medium focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-600/10 transition">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">{% trans "Emailová adresa" %}</label>
          <input type="email" name="email" required placeholder="name@firma.sk"
                 class="w-full px-4 py-3 rounded-xl border border-slate-200 text-xs font-medium focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-600/10 transition">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">{% trans "Heslo" %}</label>
          <input type="password" name="password" required placeholder="Min. 8 znakov"
                 class="w-full px-4 py-3 rounded-xl border border-slate-200 text-xs font-medium focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-600/10 transition">
        </div>

        <div class="pt-2">
          <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-xs rounded-xl shadow-lg shadow-indigo-600/20 transition">
            {% trans "Spustiť 3-dňový test zadarmo" %}
          </button>
        </div>
      </form>
    </div>

    <!-- Футер формы -->
    <p class="text-center text-xs text-slate-500 mt-6">
      {% trans "Už máte účet?" %} <a href="/login" class="font-bold text-indigo-600 hover:underline">{% trans "Prihláste sa" %}</a>
    </p>
  </div>

</body>
</html>
